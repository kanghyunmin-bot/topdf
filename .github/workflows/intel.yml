name: Intel macOS offline build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          path: |
            downloads
            ~/.cargo/registry
            ~/.cargo/git
            build/hwp-gothic-src/target
          key: intel-rc4-rust193-engines-v1
      - name: Prepare verified Intel engines
        run: |
          mkdir -p downloads Engines/intel build
          curl -fL --retry 5 --retry-all-errors 'https://download.documentfoundation.org/libreoffice/stable/26.2.6/mac/x86_64/LibreOffice_26.2.6_MacOS_x86-64.dmg' -o downloads/intel.dmg
          echo '135b8a95b8133396d54bf8e726dbc0066145efa0d785963fc3d4592acbfcfe5b  downloads/intel.dmg' | shasum -a 256 -c -
          curl -fL --retry 5 --retry-all-errors 'https://github.com/STAIxBWLB/hwp-cli/releases/download/v1.3.1/hwp-v1.3.1-x86_64-apple-darwin.tar.gz' -o downloads/hwp.tar.gz
          echo 'be087994a1b2f2db0986a2c1571b296c026681b90184c55afcd6894a6e98f093  downloads/hwp.tar.gz' | shasum -a 256 -c -
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/build/lo-mount" downloads/intel.dmg
          ditto build/lo-mount/LibreOffice.app Engines/intel/LibreOffice.app
          hdiutil detach build/lo-mount
          tar -xzf downloads/hwp.tar.gz -C Engines/intel
          find Engines/intel -type f -name hwp -exec cp '{}' Engines/intel/hwp-temp \;
          mv Engines/intel/hwp-temp Engines/intel/hwp
          chmod +x Engines/intel/hwp
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Build fallback fonts and modified HWP engine
        run: |
          python3 scripts/prepare-fonts.py
          python3 scripts/build-hwp-gothic.py --target x86_64-apple-darwin
      - uses: actions/cache/save@v4
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        with:
          path: |
            downloads
            ~/.cargo/registry
            ~/.cargo/git
            build/hwp-gothic-src/target
          key: intel-rc4-rust193-engines-v1
      - name: Build
        env:
          TOPDF_ARCH: x86_64
        run: python3 scripts/build-release.py
      - name: Verify actual Intel conversions
        run: |
          pip install pypdf Pillow reportlab python-docx
          python3 tests/validate_release.py 'build/release-intel/PDF로 변환.app'
          python3 tests/validate_font_fallback.py 'build/release-intel/PDF로 변환.app'
          codesign --verify --deep --strict 'build/release-intel/PDF로 변환.app'
          file 'build/release-intel/PDF로 변환.app/Contents/MacOS/TopDF'
      - name: Package DMG
        run: python3 scripts/package-slim.py 'build/release-intel/PDF로 변환.app' intel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TopDF-macos-intel-unsigned
          path: |
            dist/*
            tests/release-output/test-report.json
            tests/release-output/*.pdf
          retention-days: 14
