name: Windows offline build
on:
  workflow_dispatch:
  push:
    paths: ['platforms/windows/**', 'scripts/build-windows.ps1', 'Assets/AppIcon.ico', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          path: |
            downloads
            ~/.cargo/registry
            ~/.cargo/git
            build/hwp-gothic-src/target
          key: windows-rc4-rust193-engines-v1
      - name: Build native Windows app and bundle engines
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/cache/save@v4
        if: always() && steps.engine-cache.outputs.cache-hit != 'true'
        with:
          path: |
            downloads
            ~/.cargo/registry
            ~/.cargo/git
            build/hwp-gothic-src/target
          key: windows-rc4-rust193-engines-v1
      - name: Offline engine conversion tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/windows/tests | Out-Null
          foreach ($exe in @('build/windows/app/TopDF.exe','build/windows/app/Engines/hwp.exe','build/windows/app/Engines/LibreOffice/program/soffice.bin','build/windows/app/Engines/LibreOffice/program/soffice.com')) {
            New-NetFirewallRule -DisplayName ('TopDF offline verification ' + $exe) -Direction Outbound -Program (Resolve-Path $exe).Path -Action Block | Out-Null
          }
          foreach ($ext in @('docx','pptx','xlsx','hwp','hwpx')) {
            $source = (Resolve-Path "tests/sample.$ext").Path
            $output = "$pwd/build/windows/tests/$ext.pdf"
            $before = (Get-FileHash $source).Hash
            $p = Start-Process build/windows/app/TopDF.exe -ArgumentList @('--convert-test',"`"$source`"","`"$output`"") -PassThru -Wait
            if ($p.ExitCode -ne 0 -or !(Test-Path $output)) { Get-Content "$output.error.txt" -ErrorAction SilentlyContinue; throw "Conversion failed: $ext" }
            if ((Get-FileHash $source).Hash -ne $before) { throw 'Original changed' }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify text, pages and selected vector output
        shell: pwsh
        run: |
          pip install pypdf python-docx
          python tests/validate_windows.py
          python tests/validate_font_fallback.py build/windows/app
      - name: Package
        shell: pwsh
        run: |
          Remove-Item build/windows/app/.topdf-rc4-storage-ready -ErrorAction SilentlyContinue
          Compress-Archive build/windows/app/* dist/TopDF-1.0.0-rc.4-windows-x64-UNSIGNED.zip
          Get-FileHash dist/*.zip -Algorithm SHA256 | Format-List | Out-File dist/windows-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TopDF-windows-x64-unsigned
          path: |
            dist/TopDF-1.0.0-rc.4-windows-x64-UNSIGNED.zip
            dist/windows-SHA256.txt
            build/windows/tests/*.pdf
            build/windows/tests/test-report.json
            build/windows/app/size-report.json
            build/font-fallback-tests/windows/report.json
          retention-days: 14
